<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="五种 IO 模型对比：两个阶段里应用线程是否被阻塞">
<title>五种 IO 模型对比</title>
<style>
  .bg{fill:#ffffff} .ink{fill:#1f2328} .sub{fill:#6a737d} .grid{stroke:#e3e6eb} .vline{stroke:#c9ced6}
  .head{fill:#eef2f8;stroke:#c9ced6} .hl{fill:#d97706;opacity:.08} .hlhead{fill:#fdf1e2;stroke:#e8b77a}
  .blk{fill:#2f5bb7} .blkt{fill:#ffffff} .hatch{stroke:#3a6fd8;opacity:.45} .pollb{stroke:#3a6fd8}
  .free{fill:#f6f8fa;stroke:#9aa3ad} .freet{fill:#6a737d}
  .ntf{stroke:#1a7f37} .ntfh{fill:#1a7f37} .ntft{fill:#1a7f37}
  .brace{stroke:#d97706} .bracet{fill:#b45309} .axis{stroke:#9aa3ad} .axish{fill:#9aa3ad}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1b1b1f} .ink{fill:#dfdfd6} .sub{fill:#98989f} .grid{stroke:#2c2e33} .vline{stroke:#3c3f44}
    .head{fill:#25262b;stroke:#3c3f44} .hl{fill:#f59e0b;opacity:.08} .hlhead{fill:#33291c;stroke:#8a6326}
    .blk{fill:#4f7fe0} .blkt{fill:#ffffff} .hatch{stroke:#6b9bff;opacity:.5} .pollb{stroke:#6b9bff}
    .free{fill:#232428;stroke:#6b7079} .freet{fill:#98989f}
    .ntf{stroke:#3fb950} .ntfh{fill:#3fb950} .ntft{fill:#3fb950}
    .brace{stroke:#f59e0b} .bracet{fill:#fbbf24} .axis{stroke:#6b7079} .axish{fill:#6b7079}
  }
  text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<defs>
  <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line class="hatch" x1="0" y1="0" x2="0" y2="7" stroke-width="3"/>
  </pattern>
  <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="ntfh" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path class="axish" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="900" height="440" rx="12"/>

<!-- phase 2 highlight column -->
<rect class="hl" x="590" y="66" width="150" height="304"/>

<!-- header -->
<rect class="head" x="250" y="22" width="340" height="40" rx="6"/>
<text class="ink" x="420" y="40" text-anchor="middle" font-size="14" font-weight="600">① 等待数据就绪</text>
<text class="sub" x="420" y="55" text-anchor="middle" font-size="11.5">wait for data</text>
<rect class="hlhead" x="590" y="22" width="150" height="40" rx="6"/>
<text class="ink" x="665" y="40" text-anchor="middle" font-size="14" font-weight="600">② 内核 → 用户拷贝</text>
<text class="sub" x="665" y="55" text-anchor="middle" font-size="11.5">copy to user space</text>
<text class="sub" x="24" y="47" font-size="12" font-weight="600">模型 / 关键调用</text>

<!-- grid -->
<line class="grid" x1="20" y1="130" x2="745" y2="130" stroke-width="1"/>
<line class="grid" x1="20" y1="190" x2="745" y2="190" stroke-width="1"/>
<line class="grid" x1="20" y1="250" x2="745" y2="250" stroke-width="1"/>
<line class="grid" x1="20" y1="310" x2="745" y2="310" stroke-width="1"/>
<line class="vline" x1="250" y1="66" x2="250" y2="370" stroke-width="1.2" stroke-dasharray="4 4"/>
<line class="vline" x1="590" y1="66" x2="590" y2="370" stroke-width="1.2" stroke-dasharray="4 4"/>
<line class="vline" x1="740" y1="66" x2="740" y2="370" stroke-width="1.2" stroke-dasharray="4 4"/>

<!-- row labels -->
<text class="ink" x="24" y="97" font-size="14.5" font-weight="600">阻塞 IO</text>
<text class="sub mono" x="24" y="114" font-size="11.5">recvfrom()</text>
<text class="ink" x="24" y="157" font-size="14.5" font-weight="600">非阻塞 IO</text>
<text class="sub mono" x="24" y="174" font-size="11.5">O_NONBLOCK + 轮询</text>
<text class="ink" x="24" y="217" font-size="14.5" font-weight="600">IO 多路复用</text>
<text class="sub mono" x="24" y="234" font-size="11.5">select / poll / epoll</text>
<text class="ink" x="24" y="277" font-size="14.5" font-weight="600">信号驱动 IO</text>
<text class="sub mono" x="24" y="294" font-size="11.5">SIGIO + recvfrom()</text>
<text class="ink" x="24" y="337" font-size="14.5" font-weight="600">异步 IO</text>
<text class="sub mono" x="24" y="354" font-size="11.5">io_uring / IOCP / aio</text>

<!-- row 1: blocking -->
<rect class="blk" x="250" y="90" width="490" height="20" rx="3"/>
<text class="blkt" x="495" y="104.5" text-anchor="middle" font-size="12.5">recvfrom() 一直阻塞，直到数据拷进用户缓冲区</text>

<!-- row 2: non-blocking polling -->
<rect x="250" y="150" width="338" height="20" rx="3" fill="url(#hatch)"/>
<rect class="pollb" x="250" y="150" width="338" height="20" rx="3" fill="none" stroke-width="1.2"/>
<text class="ink" x="419" y="164.5" text-anchor="middle" font-size="12.5" font-weight="600">反复 recvfrom() → EAGAIN（忙等，占 CPU）</text>
<rect class="blk" x="592" y="150" width="148" height="20" rx="3"/>
<text class="blkt" x="666" y="164.5" text-anchor="middle" font-size="12.5">recvfrom()</text>

<!-- row 3: multiplexing -->
<rect class="blk" x="250" y="210" width="338" height="20" rx="3"/>
<text class="blkt" x="419" y="224.5" text-anchor="middle" font-size="12.5">epoll_wait()：一次等 N 个 fd</text>
<rect class="blk" x="592" y="210" width="148" height="20" rx="3"/>
<text class="blkt" x="666" y="224.5" text-anchor="middle" font-size="12.5">recvfrom()</text>

<!-- row 4: signal-driven -->
<rect class="free" x="250" y="270" width="338" height="20" rx="3" stroke-width="1.2" stroke-dasharray="4 3"/>
<text class="freet" x="419" y="284.5" text-anchor="middle" font-size="12.5">注册 SIGIO 后返回，线程去干别的</text>
<rect class="blk" x="592" y="270" width="148" height="20" rx="3"/>
<text class="blkt" x="666" y="284.5" text-anchor="middle" font-size="12.5">recvfrom()</text>
<line class="ntf" x1="590" y1="251" x2="590" y2="268" stroke-width="2" marker-end="url(#n)"/>
<text class="ntft mono" x="596" y="262" font-size="11.5" font-weight="700">SIGIO</text>

<!-- row 5: async -->
<rect class="free" x="250" y="330" width="490" height="20" rx="3" stroke-width="1.2" stroke-dasharray="4 3"/>
<text class="freet" x="495" y="344.5" text-anchor="middle" font-size="12.5">提交请求后立即返回，两个阶段线程都不被卡住</text>
<line class="ntf" x1="740" y1="311" x2="740" y2="328" stroke-width="2" marker-end="url(#n)"/>
<text class="ntft" x="733" y="322" text-anchor="end" font-size="11.5" font-weight="700">内核拷完再通知</text>

<!-- time axis -->
<line class="axis" x1="250" y1="384" x2="740" y2="384" stroke-width="1.2" marker-end="url(#t)"/>
<text class="sub" x="740" y="400" text-anchor="end" font-size="11.5">时间</text>
<text class="sub" x="590" y="400" text-anchor="middle" font-size="11.5">数据到达内核</text>

<!-- braces -->
<path class="brace" d="M752,82 L760,82 L760,298 L752,298" fill="none" stroke-width="2"/>
<text class="bracet" x="772" y="182" font-size="15" font-weight="700">同步 IO</text>
<text class="sub" x="772" y="201" font-size="12">② 要应用线程</text>
<text class="sub" x="772" y="217" font-size="12">自己阻塞着拷</text>
<path class="brace" d="M752,322 L760,322 L760,358 L752,358" fill="none" stroke-width="2"/>
<text class="bracet" x="772" y="338" font-size="15" font-weight="700">异步 IO</text>
<text class="sub" x="772" y="355" font-size="12">① ② 都不阻塞</text>

<!-- legend -->
<rect class="blk" x="250" y="414" width="22" height="12" rx="2"/>
<text class="ink" x="278" y="424.5" font-size="12">线程阻塞</text>
<rect x="352" y="414" width="22" height="12" rx="2" fill="url(#hatch)"/>
<rect class="pollb" x="352" y="414" width="22" height="12" rx="2" fill="none" stroke-width="1"/>
<text class="ink" x="380" y="424.5" font-size="12">忙等轮询</text>
<rect class="free" x="454" y="414" width="22" height="12" rx="2" stroke-width="1" stroke-dasharray="3 2"/>
<text class="ink" x="482" y="424.5" font-size="12">线程空闲，可做别的</text>
<line class="ntf" x1="610" y1="420" x2="634" y2="420" stroke-width="2" marker-end="url(#n)"/>
<text class="ink" x="640" y="424.5" font-size="12">内核通知</text>
</svg>
